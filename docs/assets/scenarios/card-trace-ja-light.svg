<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title"><title id="title">すべての記憶に、出典がある</title><defs><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7a879e"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0866ee"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><rect x="1" y="1" width="638" height="358" rx="18" fill="#f7f9fd" stroke="#dde4ef"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',Arial,sans-serif"><rect x="32" y="28" width="134" height="26" rx="13" fill="#e8f1ff"/><text x="45" y="46" font-size="13.5" font-weight="700" fill="#0866ee" text-anchor="start">出典とリビジョン</text><text x="32" y="94" font-size="26" font-weight="800" fill="#0f1b33" text-anchor="start">すべての記憶に、出典がある</text><text x="32" y="126" font-size="15.5" font-weight="400" fill="#4a5875" text-anchor="start">回答は出典つき。当時の記録と正確なリビジョンまでたどれる。</text><rect x="32" y="170" width="272" height="96" rx="12" fill="#e8f1ff" stroke="#e8f1ff"/><text x="48" y="198" font-size="13" font-weight="700" fill="#7a879e" text-anchor="start">Agent の回答</text><text x="48" y="232" font-size="15" font-weight="600" fill="#0f1b33" text-anchor="start">移行中は旧 SKU 対応を残す。</text><rect x="262" y="182" width="30" height="22" rx="11" fill="#0866ee"/><text x="277" y="198" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><path d="M310 218L328 218" stroke="#0866ee" stroke-width="2" fill="none" marker-end="url(#head-accent)"/><rect x="334" y="150" width="274" height="176" rx="10" fill="#ffffff" stroke="#0866ee"/><text x="352" y="182" font-size="16" font-weight="700" fill="#0866ee" text-anchor="start">出典 [1]</text><rect x="352" y="198" width="238" height="34" rx="8" fill="#f7f9fd" stroke="#f7f9fd"/><text x="366" y="220" font-size="14.5" font-weight="400" fill="#4a5875" text-anchor="start">セッション記録 · 月曜</text><rect x="352" y="238" width="238" height="34" rx="8" fill="#f7f9fd" stroke="#f7f9fd"/><text x="366" y="260" font-size="14.5" font-weight="400" fill="#4a5875" text-anchor="start">40–55 行目</text><rect x="352" y="278" width="238" height="34" rx="8" fill="#f7f9fd" stroke="#f7f9fd"/><text x="366" y="300" font-size="14.5" font-weight="400" fill="#4a5875" text-anchor="start">記憶リビジョン @1</text></g></svg>
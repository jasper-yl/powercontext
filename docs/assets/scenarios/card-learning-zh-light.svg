<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title"><title id="title">越用越懂你的项目</title><defs><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7a879e"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0866ee"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><rect x="1" y="1" width="638" height="358" rx="18" fill="#f7f9fd" stroke="#dde4ef"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',Arial,sans-serif"><rect x="32" y="28" width="149" height="26" rx="13" fill="#e8f1ff"/><text x="45" y="46" font-size="13.5" font-weight="700" fill="#0866ee" text-anchor="start">主题记忆与 Dream</text><text x="32" y="94" font-size="26" font-weight="800" fill="#0f1b33" text-anchor="start">越用越懂你的项目</text><text x="32" y="126" font-size="15.5" font-weight="400" fill="#4a5875" text-anchor="start">讨论沉淀成主题，经验经你审核后更新。</text><rect x="32" y="176" width="128" height="64" rx="10" fill="#ffffff" stroke="#dde4ef"/><text x="96.0" y="213" font-size="14" font-weight="600" fill="#0f1b33" text-anchor="middle">日常讨论</text><path d="M162 208L180 208" stroke="#7a879e" stroke-width="2" fill="none" marker-end="url(#head-muted)"/><rect x="182" y="176" width="128" height="64" rx="10" fill="#ffffff" stroke="#dde4ef"/><text x="246.0" y="213" font-size="14" font-weight="600" fill="#0f1b33" text-anchor="middle">主题摘要</text><path d="M312 208L330 208" stroke="#7a879e" stroke-width="2" fill="none" marker-end="url(#head-muted)"/><rect x="332" y="176" width="128" height="64" rx="10" fill="#ffffff" stroke="#dde4ef"/><text x="396.0" y="213" font-size="14" font-weight="600" fill="#0f1b33" text-anchor="middle">Dream 提出修订</text><path d="M462 208L480 208" stroke="#7a879e" stroke-width="2" fill="none" marker-end="url(#head-muted)"/><rect x="482" y="176" width="128" height="64" rx="10" fill="#e8f1ff" stroke="#0866ee"/><text x="546.0" y="213" font-size="14" font-weight="700" fill="#0866ee" text-anchor="middle">✓ 你来审核</text><text x="320" y="290" font-size="13.5" font-weight="400" fill="#7a879e" text-anchor="middle">Dream 根据过往依据提出修订，批准后才生效</text></g></svg>
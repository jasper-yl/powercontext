<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title"><title id="title">记住你的习惯和规矩</title><defs><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7a879e"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0866ee"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><rect x="1" y="1" width="638" height="358" rx="18" fill="#f7f9fd" stroke="#dde4ef"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',Arial,sans-serif"><rect x="32" y="28" width="120" height="26" rx="13" fill="#e8f1ff"/><text x="45" y="46" font-size="13.5" font-weight="700" fill="#0866ee" text-anchor="start">画像与记忆规则</text><text x="32" y="94" font-size="26" font-weight="800" fill="#0f1b33" text-anchor="start">记住你的习惯和规矩</text><text x="32" y="126" font-size="15.5" font-weight="400" fill="#4a5875" text-anchor="start">偏好只说一次；记什么、怎么整理，由你定。</text><rect x="32" y="156" width="250" height="54" rx="12" fill="#e8f1ff" stroke="#e8f1ff"/><text x="48" y="189" font-size="15" font-weight="600" fill="#0f1b33" text-anchor="start">“设计评审放到语雀。”</text><rect x="32" y="252" width="250" height="74" rx="10" fill="#ffffff" stroke="#dde4ef" stroke-dasharray="5 4"/><text x="48" y="278" font-size="13" font-weight="700" fill="#7a879e" text-anchor="start">记忆规则</text><text x="48" y="306" font-size="15" font-weight="600" fill="#0f1b33" text-anchor="start">只保留长期决策和约束</text><path d="M288 183L326 214" stroke="#7a879e" stroke-width="2" fill="none" marker-end="url(#head-muted)"/><path d="M288 289L326 268" stroke="#7a879e" stroke-width="2" fill="none" marker-end="url(#head-muted)"/><rect x="334" y="156" width="274" height="170" rx="10" fill="#ffffff" stroke="#0866ee"/><text x="352" y="188" font-size="16" font-weight="700" fill="#0866ee" text-anchor="start">你的画像</text><rect x="352" y="206" width="238" height="40" rx="8" fill="#f7f9fd" stroke="#f7f9fd"/><text x="366" y="232" font-size="15" font-weight="400" fill="#4a5875" text-anchor="start">文档工具：语雀</text><rect x="352" y="258" width="238" height="40" rx="8" fill="#f7f9fd" stroke="#f7f9fd"/><text x="366" y="284" font-size="15" font-weight="400" fill="#4a5875" text-anchor="start">写作：先结论，后细节</text></g></svg>
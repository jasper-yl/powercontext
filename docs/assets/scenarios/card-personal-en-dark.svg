<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title"><title id="title">Your habits, your rules</title><defs><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8391a8"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b9dff"/></marker></defs><rect width="640" height="360" fill="#0d1117"/><rect x="1" y="1" width="638" height="358" rx="18" fill="#121a28" stroke="#283449"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',Arial,sans-serif"><rect x="32" y="28" width="228" height="26" rx="13" fill="#16284a"/><text x="45" y="46" font-size="13.5" font-weight="700" fill="#5b9dff" text-anchor="start">Profile &amp; memory rules</text><text x="32" y="94" font-size="26" font-weight="800" fill="#eef3fc" text-anchor="start">Your habits, your rules</text><text x="32" y="126" font-size="15.5" font-weight="400" fill="#b2bed2" text-anchor="start">Say a preference once. You decide what is kept and how.</text><rect x="32" y="156" width="250" height="54" rx="12" fill="#16284a" stroke="#16284a"/><text x="48" y="189" font-size="15" font-weight="600" fill="#eef3fc" text-anchor="start">“Use Notion for reviews.”</text><rect x="32" y="252" width="250" height="74" rx="10" fill="#0f1726" stroke="#283449" stroke-dasharray="5 4"/><text x="48" y="278" font-size="13" font-weight="700" fill="#8391a8" text-anchor="start">Memory rule</text><text x="48" y="306" font-size="15" font-weight="600" fill="#eef3fc" text-anchor="start">Long-term decisions only</text><path d="M288 183L326 214" stroke="#8391a8" stroke-width="2" fill="none" marker-end="url(#head-muted)"/><path d="M288 289L326 268" stroke="#8391a8" stroke-width="2" fill="none" marker-end="url(#head-muted)"/><rect x="334" y="156" width="274" height="170" rx="10" fill="#0f1726" stroke="#5b9dff"/><text x="352" y="188" font-size="16" font-weight="700" fill="#5b9dff" text-anchor="start">Your profile</text><rect x="352" y="206" width="238" height="40" rx="8" fill="#121a28" stroke="#121a28"/><text x="366" y="232" font-size="15" font-weight="400" fill="#b2bed2" text-anchor="start">Docs: Notion</text><rect x="352" y="258" width="238" height="40" rx="8" fill="#121a28" stroke="#121a28"/><text x="366" y="284" font-size="15" font-weight="400" fill="#b2bed2" text-anchor="start">Writing: conclusion first</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title"><title id="title">一度解けば、次から使える</title><defs><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7a879e"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0866ee"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><rect x="1" y="1" width="638" height="358" rx="18" fill="#f7f9fd" stroke="#dde4ef"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',Arial,sans-serif"><rect x="32" y="28" width="107" height="26" rx="13" fill="#e8f1ff"/><text x="45" y="46" font-size="13.5" font-weight="700" fill="#0866ee" text-anchor="start">経験とスキル</text><text x="32" y="94" font-size="26" font-weight="800" fill="#0f1b33" text-anchor="start">一度解けば、次から使える</text><text x="32" y="126" font-size="15.5" font-weight="400" fill="#4a5875" text-anchor="start">検証済みのやり方を経験とスキルに。レビュー後に Agent へ。</text><rect x="32" y="150" width="262" height="176" rx="10" fill="#ffffff" stroke="#dde4ef"/><text x="50" y="180" font-size="14" font-weight="700" fill="#7a879e" text-anchor="start">うまくいった調査</text><text x="50" y="218" font-size="15" font-weight="400" fill="#4a5875" text-anchor="start">状況：テストがときどき失敗</text><text x="50" y="250" font-size="15" font-weight="400" fill="#4a5875" text-anchor="start">対応：乱数シードを固定</text><text x="50" y="282" font-size="15" font-weight="400" fill="#4a5875" text-anchor="start">結果：安定して成功</text><path d="M300 238L336 238" stroke="#0866ee" stroke-width="2" fill="none" marker-end="url(#head-accent)"/><rect x="346" y="150" width="262" height="176" rx="10" fill="#ffffff" stroke="#0866ee"/><text x="364" y="184" font-size="16" font-weight="700" fill="#0866ee" text-anchor="start">スキル：不安定テスト対応</text><rect x="364" y="204" width="226" height="40" rx="8" fill="#e8f1ff" stroke="#e8f1ff"/><text x="378" y="230" font-size="15" font-weight="600" fill="#0f8a5f" text-anchor="start">✓ 承認済み</text><rect x="364" y="256" width="226" height="40" rx="8" fill="#f7f9fd" stroke="#f7f9fd"/><text x="378" y="282" font-size="15" font-weight="600" fill="#0f1b33" text-anchor="start">→ Codex へエクスポート</text></g></svg>
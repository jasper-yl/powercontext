name: atomic-memory-plugin
kind: artifact
entry: ./plugin.py:create
generate:
  family: atomic-memory-plugin
  inputs:
    source_types: [content]
    projection: powercontext.text-evidence@1
    max_sources: 20
  on_sources: true
  manual: true
  timeout_seconds: 600
  transaction_timeout_seconds: 30
config:
  model: ${ATOMIC_MEMORY_PLUGIN_MODEL}

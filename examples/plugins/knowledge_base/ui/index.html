<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge bases</title>
  <link rel="stylesheet" href="app.css">
  <script src="/dashboard/plugins/_client.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h1 data-i18n="knowledge_bases"></h1>
        <button type="button" class="button primary small" id="new-kb" hidden data-i18n="new"></button>
      </div>
      <form class="card new-kb" id="new-kb-form" hidden>
        <label><span data-i18n="name"></span><input name="name" required maxlength="256" autocomplete="off"></label>
        <label><span data-i18n="description"></span><textarea name="description" rows="2" maxlength="2000"></textarea></label>
        <div class="row end">
          <button type="button" class="button" data-cancel data-i18n="cancel"></button>
          <button type="submit" class="button primary" data-i18n="create"></button>
        </div>
      </form>
      <ul class="kb-list" id="kb-list" aria-live="polite"></ul>
      <p class="muted empty" id="kb-empty" hidden data-i18n="no_knowledge_bases"></p>
      <footer class="models" id="models"></footer>
    </aside>

    <main class="main">
      <section class="placeholder" id="placeholder">
        <h2 data-i18n="welcome_title"></h2>
        <p class="muted" data-i18n="welcome_text"></p>
      </section>

      <section id="workspace" hidden>
        <header class="kb-head">
          <div class="kb-title">
            <h2 id="kb-name"></h2>
            <p class="muted" id="kb-description"></p>
          </div>
          <div class="row">
            <button type="button" class="button" id="edit-kb" data-i18n="edit"></button>
            <button type="button" class="button danger" id="delete-kb" hidden data-i18n="delete"></button>
          </div>
        </header>
        <form class="card edit-kb" id="edit-kb-form" hidden>
          <label><span data-i18n="name"></span><input name="name" required maxlength="256" autocomplete="off"></label>
          <label><span data-i18n="description"></span><textarea name="description" rows="2" maxlength="2000"></textarea></label>
          <label><span data-i18n="default_parser"></span><select name="default_parser" id="default-parser"></select></label>
          <div class="row end">
            <button type="button" class="button" data-cancel data-i18n="cancel"></button>
            <button type="submit" class="button primary" data-i18n="save"></button>
          </div>
        </form>

        <nav class="tabs" role="tablist">
          <button type="button" role="tab" class="tab" data-tab="documents" aria-selected="true" data-i18n="documents"></button>
          <button type="button" role="tab" class="tab" data-tab="ask" aria-selected="false" data-i18n="search_and_ask"></button>
        </nav>

        <div class="panel" data-panel="documents">
          <label class="dropzone" id="dropzone">
            <input type="file" id="file-input" multiple>
            <strong data-i18n="upload_title"></strong>
            <span class="muted" id="upload-hint"></span>
          </label>
          <form class="card pending" id="pending" hidden>
            <strong id="pending-title"></strong>
            <div class="parser-picker" id="pending-parser"></div>
            <div class="row between">
              <label class="inline check"><input type="checkbox" name="make_default" checked><span data-i18n="make_default"></span></label>
              <button type="submit" class="button primary" data-i18n="start_processing"></button>
            </div>
          </form>
          <div class="table-wrap">
            <table class="documents">
              <thead><tr>
                <th data-i18n="document"></th><th data-i18n="status"></th><th class="num" data-i18n="chunks"></th>
                <th class="num" data-i18n="revision"></th><th class="num" data-i18n="size"></th><th></th>
              </tr></thead>
              <tbody id="documents"></tbody>
            </table>
            <p class="muted empty" id="documents-empty" hidden data-i18n="no_documents"></p>
          </div>
        </div>

        <div class="panel" data-panel="ask" hidden>
          <form class="card ask" id="ask-form">
            <textarea name="question" rows="3" required maxlength="2000" data-i18n-placeholder="question_placeholder"></textarea>
            <fieldset class="targets">
              <legend data-i18n="search_in"></legend>
              <div id="targets"></div>
            </fieldset>
            <div class="row between">
              <label class="inline"><span data-i18n="mode"></span>
                <select name="mode">
                  <option value="hybrid" data-i18n="mode_hybrid"></option>
                  <option value="keyword" data-i18n="mode_keyword"></option>
                  <option value="vector" data-i18n="mode_vector"></option>
                </select>
              </label>
              <div class="row">
                <button type="submit" class="button" name="action" value="search" data-i18n="search"></button>
                <button type="submit" class="button primary" name="action" value="ask" data-i18n="ask"></button>
              </div>
            </div>
          </form>
          <div class="card answer" id="answer" hidden></div>
          <ol class="hits" id="hits"></ol>
        </div>
      </section>
    </main>
  </div>
  <div class="overlay" id="chunk-panel" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="chunk-title">
      <header class="sheet-head">
        <div>
          <h2 id="chunk-title"></h2>
          <p class="muted" id="chunk-meta"></p>
        </div>
        <button type="button" class="button" id="chunk-close" data-i18n="close"></button>
      </header>
      <details class="card reparse">
        <summary data-i18n="reparse_title"></summary>
        <div class="parser-picker" id="chunk-parser"></div>
        <div class="row end"><button type="button" class="button" id="chunk-reparse" data-i18n="reparse"></button></div>
      </details>
      <ol class="chunk-list" id="chunk-list"></ol>
      <footer class="sheet-foot row between">
        <button type="button" class="button" id="chunk-restore" data-i18n="restore_previous"></button>
        <button type="button" class="button primary" id="chunk-save" data-i18n="save_chunks"></button>
      </footer>
    </section>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
